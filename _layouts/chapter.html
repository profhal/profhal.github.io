---
layout: default
---

<article class="chapter">

  <header class="chapter-header">

    <p class="book-parent">
      <a href="/">Home</a> / 
      <a href="{{ '/learning-to-play/' | relative_url }}">Learning to Play</a>
      / {{ page.title }}
    </p>

    <h1 class="chapter-title">
    Chapter {{ page.chapter }}: {{ page.title }}
    </h1>

    {% if page.subtitle %}
      <p class="chapter-subtitle">{{ page.subtitle }}</p>
    {% endif %}

  </header>

  <div class="chapter-content">
    {{ content }}
  </div>

  <footer class="chapter-footer">
    <a href="{{ '/learning-to-play/' | relative_url }}">
      &larr; Table of Contents
    </a>
  </footer>

</article>
