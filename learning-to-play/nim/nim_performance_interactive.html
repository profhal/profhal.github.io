const colors={Constant1:'#2563a6',M2:'#cb6637',M4:'#26916c'};
const labels={Constant1:'NaiveConstant1',M2:'M2',M4:'M4'};
const svg=document.getElementById('svg'),tip=document.getElementById('tooltip'),chart=document.getElementById('chart');
const lo=document.getElementById('lo'),hi=document.getElementById('hi'),order=document.getElementById('order');
const selected=()=>Object.keys(colors).filter(a=>document.querySelector('[data-agent="'+a+'"]').checked);
const bounds=()=>[Math.min(+lo.value,+hi.value),Math.max(+lo.value,+hi.value)];
function series(){const [min,max]=bounds(),mode=order.value;return selected().map(agent=>({agent,pts:Array.from({length:max-min+1},(_,i)=>{const n=min+i,rs=raw.filter(r=>r.agent===agent&&r.n===n&&(mode==='both'||r.order===mode));const wins=rs.reduce((s,r)=>s+r.wins,0),games=rs.reduce((s,r)=>s+r.games,0);return {n,wins,games,pct:100*wins/games}})}));}
const ns='http://www.w3.org/2000/svg';function el(tag,attrs={},parent=svg){const node=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));parent.appendChild(node);return node}
function text(x,y,str,attrs={}){const node=el('text',{x,y,fill:'#536071','font-size':13,...attrs});node.textContent=str;return node}
let hoverTargets=[];
function render(){svg.replaceChildren();hoverTargets=[];tip.style.display='none';const W=1000,H=475,L=67,R=22,T=20,B=52,plotW=W-L-R,plotH=H-T-B;const [min,max]=bounds(),span=Math.max(1,max-min);const X=n=>L+(n-min)/span*plotW,Y=p=>T+(100-p)/100*plotH;
for(let v=0;v<=100;v+=20){let y=Y(v);el('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'#e6eaf0'});text(L-12,y+5,v+'%',{'text-anchor':'end'})}
let ry=Y(200/3);el('line',{x1:L,x2:W-R,y1:ry,y2:ry,stroke:'#7d8490','stroke-dasharray':'6 6','stroke-width':1.5});
const step=span<=16?1:span<=35?5:10;for(let n=Math.ceil(min/step)*step;n<=max;n+=step){text(X(n),H-B+21,String(n),{'text-anchor':'middle'})}if(min%step!==0)text(X(min),H-B+21,String(min),{'text-anchor':'middle'});if(max%step!==0)text(X(max),H-B+21,String(max),{'text-anchor':'middle'});
text((L+W-R)/2,H-8,'Initial number of sticks',{'text-anchor':'middle','font-size':14});const ytitle=text(18,H/2,'Agent win rate (%)',{'text-anchor':'middle','font-size':14});ytitle.setAttribute('transform','rotate(-90 18 '+H/2+')');

function show(ev){if(!hoverTargets.length)return;const rect=svg.getBoundingClientRect(),x=(ev.clientX-rect.left)/rect.width*W,y=(ev.clientY-rect.top)/rect.height*H;const n=Math.max(min,Math.min(max,Math.round(min+(x-L)/plotW*span)));const points=hoverTargets.filter(t=>t.p.n===n);if(!points.length)return;guide.setAttribute('x1',X(n));guide.setAttribute('x2',X(n));guide.setAttribute('visibility','visible');tip.innerHTML='<strong>'+n+' sticks</strong><br>'+points.map(t=>'<span style="color:'+colors[t.agent]+'">●</span> '+labels[t.agent]+': <strong>'+t.p.pct.toFixed(2)+'%</strong> ('+t.p.wins.toLocaleString()+' / '+t.p.games.toLocaleString()+')').join('<br>');tip.style.display='block';const px=(X(n)/W)*rect.width;const py=Math.max(12,Math.min(rect.height-15,(y/H)*rect.height));tip.style.left=Math.max(6,Math.min(rect.width-tip.offsetWidth-6,px+12))+'px';tip.style.top=Math.max(6,Math.min(rect.height-tip.offsetHeight-6,py-tip.offsetHeight-12))+'px'}
overlay.addEventListener('pointermove',show);overlay.addEventListener('pointerdown',show);overlay.addEventListener('pointerleave',()=>{tip.style.display='none';guide.setAttribute('visibility','hidden')});
}
